services:
  - type: web
    name: jeju-now-981
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_MODE
        value: auto
      - key: INGEST_TOKEN
        generateValue: true
