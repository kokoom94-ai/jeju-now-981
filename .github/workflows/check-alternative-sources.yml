name: Check alternative live sources
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/check-alternative-sources.yml'
permissions: {}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect TLS metadata and public page state
        run: |
          python3 - <<'PY'
          import json,re,urllib.request,urllib.robotparser,subprocess
          from html.parser import HTMLParser
          from datetime import datetime,timezone
          UA='JejuNow981/2.2 (+https://github.com/kokoom94-ai/jeju-now-981)'
          def get(u):
            with urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':UA}),timeout=15) as r:
              return r.read(2000000).decode('utf8','replace')
          print('CHECKED_AT',datetime.now(timezone.utc).isoformat())
          try:
            tls=subprocess.run(['openssl','s_client','-connect','data.ijto.or.kr:443','-servername','data.ijto.or.kr','-showcerts','-verify_return_error'],input='',text=True,capture_output=True,timeout=20)
            certs=re.findall(r'-----BEGIN CERTIFICATE-----.*?-----END CERTIFICATE-----',tls.stdout,re.S)
            print('CERTIFICATE_COUNT',len(certs))
            for pem in certs[:3]:
              p=subprocess.run(['openssl','x509','-noout','-subject','-issuer','-dates','-ext','authorityInfoAccess'],input=pem,text=True,capture_output=True)
              print('CERT_METADATA',p.stdout)
            print('TLS_DIAGNOSTIC',tls.stderr[-700:])
          except Exception as e:print('TLS_METADATA_ERROR',str(e)[:200])
          root='https://www.visitjeju.net';page=root+'/kr/detail/view?contentsid=CNTS_200000000008633'
          try:
            robots=get(root+'/robots.txt');rp=urllib.robotparser.RobotFileParser();rp.parse(robots.splitlines())
            if not rp.can_fetch(UA,page):raise ValueError('robots disallows page')
            html=get(page)
            class P(HTMLParser):
              def __init__(self):super().__init__();self.scripts=[];self.data=[];self.keep=False
              def handle_starttag(self,t,a):
                a=dict(a)
                if t=='script' and a.get('src'):self.scripts.append(a['src'])
                if t=='script' and a.get('id')=='__NUXT_DATA__':self.keep=True
              def handle_data(self,d):
                if self.keep:self.data.append(d)
              def handle_endtag(self,t):
                if t=='script':self.keep=False
            p=P();p.feed(html)
            print('SCRIPTS',json.dumps(p.scripts))
            for m in re.finditer(r'<(?:button|div)[^>]*class="[^"]*congestion[^"<>]*"[^>]*>',html,re.I):print('BADGE_MARKUP',html[m.start():m.start()+900])
            data=json.loads(''.join(p.data)) if p.data else None
            print('STATE_TYPE',type(data).__name__)
            if isinstance(data,list):
              for i,v in enumerate(data):
                if isinstance(v,dict):
                  keys=[k for k in v if re.search('congest|skt|population|crowd',k,re.I)]
                  for k in keys:
                    val=v[k];resolved=data[val] if isinstance(val,int) and 0<=val<len(data) else val
                    print('STATE_FIELD',i,k,json.dumps(resolved,ensure_ascii=False)[:1200])
            for x in p.scripts[:2]:
              u=urllib.parse.urljoin(root,x)
              if urllib.parse.urlsplit(u).netloc!=urllib.parse.urlsplit(root).netloc or not rp.can_fetch(UA,u):continue
              js=get(u)
              for m in list(re.finditer(r'congest|skt|population',js,re.I))[:15]:print('JS_CONTEXT',js[max(0,m.start()-160):m.start()+250])
          except Exception as e:print('PUBLIC_INSPECTION_ERROR',str(e)[:240])
          PY
