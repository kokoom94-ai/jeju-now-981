name: Verify Little Park 2.1
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/verify-village.yml'
      - 'index.html'
      - 'assets/village.js'
      - 'assets/village.css'
permissions:
  contents: read
concurrency:
  group: verify-village
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --check assets/village.js
      - name: Check local server and wait for public assets
        shell: bash
        run: |
          PORT=8086 DATA_MODE=estimated node server.mjs > /tmp/981-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 2
          python3 - <<'PY'
          import json, time, hashlib, urllib.request, pathlib, datetime
          files = ['index.html', 'assets/village.css', 'assets/village.js']
          expected = {f: hashlib.sha256(pathlib.Path(f).read_bytes()).hexdigest() for f in files}
          report = {'version':'village-2.1.0','checkedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),'expectedSha256':expected,'deployed':False,'attempts':[]}
          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':'JejuNow981-DeploymentCheck/2.1','Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=18) as r:
                  return r.status,r.read(2000000)
          code,b=get('http://127.0.0.1:8086/health')
          assert code==200 and json.loads(b).get('ok') is True
          code,b=get('http://127.0.0.1:8086/api/v1/parks/981/live')
          live=json.loads(b)
          assert sum(z['count'] for z in live['zones'])==live['people']['total']
          report['localServer']='passed'
          for attempt in range(10):
              result={'attempt':attempt+1,'matches':{}}
              try:
                  for f in files:
                      path='/' if f=='index.html' else '/'+f
                      code,b=get('https://jeju-now-981.onrender.com'+path+'?releaseCheck=village-2.1.0-'+str(attempt))
                      result['matches'][f]=code==200 and hashlib.sha256(b).hexdigest()==expected[f]
                  if all(result['matches'].values()):
                      code,b=get('https://jeju-now-981.onrender.com/health')
                      health=json.loads(b)
                      report['publicHealth']={'http':code,'ok':health.get('ok'),'mode':health.get('mode'),'source':health.get('source')}
                      report['deployed']=code==200 and health.get('ok') is True
              except Exception as e:
                  result['error']=str(e)[:240]
              report['attempts'].append(result)
              print(json.dumps(result,ensure_ascii=False),flush=True)
              if report['deployed']: break
              time.sleep(12)
          pathlib.Path('deployment-verification.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          print('DEPLOYMENT_RESULT',json.dumps(report,ensure_ascii=False),flush=True)
          PY
      - name: Package current tracked source
        if: always()
        run: git archive --format=zip --prefix=jeju-now-981-village-2.1/ HEAD -o jeju-now-981-village-2.1-source.zip
      - name: Upload source and verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: little-park-2.1-source-and-verification
          path: |
            jeju-now-981-village-2.1-source.zip
            deployment-verification.json
          retention-days: 7
