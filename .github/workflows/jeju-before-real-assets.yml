name: Acquire JEJU BEFORE real geometry and materials
on:
  push:
    branches: [jeju-before-web]
    paths: [realism/acquire.mjs, .github/workflows/jeju-before-real-assets.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: jeju-before-real-assets
  cancel-in-progress: false
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node realism/acquire.mjs
      - name: Commit verified snapshot and licensed assets only
        run: |
          git config user.name 'JEJU BEFORE build'
          git config user.email 'jeju-before-build@users.noreply.github.com'
          git add realism/world-v2.json realism/vendor realism/assets realism/acquisition.json realism/LICENSES.txt
          git commit -m 'Add actual OSM snapshot and CC0 photo surface materials [skip ci]'
          git pull --rebase origin jeju-before-web
          git push origin HEAD:jeju-before-web
      - uses: actions/upload-artifact@v4
        with:
          name: jeju-before-real-assets
          path: realism/
          retention-days: 7
