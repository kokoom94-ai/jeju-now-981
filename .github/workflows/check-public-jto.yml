name: Check official 981 public data
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/check-public-jto.yml'
permissions: {}
concurrency:
  group: check-public-jto
  cancel-in-progress: false
jobs:
  inspect-public-route:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect only public linked pages, without credentials
        shell: bash
        run: |
          python3 - <<'PY'
          import json, re, time, urllib.request, urllib.error, urllib.parse, urllib.robotparser
          from html.parser import HTMLParser
          from datetime import datetime, timezone

          ROOT = 'https://data.ijto.or.kr'
          PAGE = ROOT + '/bigdata/sub01.do?contentsid=CNTS_200000000008633'
          UA = 'JejuNow981-PublicRouteCheck/1.0'
          LIMIT = 1500000

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          opener = urllib.request.build_opener(NoRedirect)
          def get(url):
              request = urllib.request.Request(url, headers={'User-Agent': UA, 'Accept': 'text/html,application/json,text/plain,*/*'})
              try:
                  with opener.open(request, timeout=15) as response:
                      raw = response.read(LIMIT + 1)
                      if len(raw) > LIMIT:
                          return response.status, '', 'response-too-large'
                      return response.status, raw.decode('utf-8', 'replace'), response.headers.get('Content-Type', '')
              except urllib.error.HTTPError as error:
                  return error.code, '', 'http-error-or-redirect'
              except Exception as error:
                  return 0, '', type(error).__name__

          def safe_url(url):
              parts = urllib.parse.urlsplit(url)
              return urllib.parse.urlunsplit((parts.scheme, parts.netloc, parts.path, '', ''))

          print('CHECKED_AT', datetime.now(timezone.utc).isoformat())
          for suffix in ['/health', '/api/v1/parks/981/skt/status']:
              code, body, kind = get('https://jeju-now-981.onrender.com' + suffix)
              print('SERVICE', suffix, 'HTTP', code, kind)
              if code == 200:
                  try:
                      obj = json.loads(body)
                      print('SERVICE_FIELDS', json.dumps({k: obj.get(k) for k in ['ok', 'mode', 'source', 'connected', 'configured', 'state', 'provider', 'providerState'] if k in obj}, ensure_ascii=False)[:3500])
                  except ValueError:
                      print('SERVICE_NON_JSON')

          code, text, kind = get(ROOT + '/robots.txt')
          print('ROBOTS', code, kind)
          robot = urllib.robotparser.RobotFileParser()
          if code == 200 and 'text/html' not in kind.lower():
              robot.parse(text.splitlines())
          elif code == 404:
              robot.parse([])
          else:
              print('STOP: could not establish automated-access policy; no further public-site requests')
              raise SystemExit(0)

          class Links(HTMLParser):
              def __init__(self):
                  super().__init__(); self.scripts=[]; self.frames=[]
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == 'script' and attrs.get('src'): self.scripts.append(attrs['src'])
                  if tag == 'iframe' and attrs.get('src'): self.frames.append(attrs['src'])

          def inspect(url):
              if not robot.can_fetch(UA, url):
                  print('ROBOTS_DISALLOWED', safe_url(url)); return None
              code, body, kind = get(url)
              print('PUBLIC_PAGE', safe_url(url), 'HTTP', code, kind, 'CHARACTERS', len(body))
              if code != 200: return None
              if re.search(r'captcha|access denied|verify you are human', body, re.I):
                  print('STOP: challenge page; no attempts to bypass'); return None
              parser = Links()
              if 'html' in kind:
                  parser.feed(body)
                  title = re.search(r'<title[^>]*>(.*?)</title>', body, re.S|re.I)
                  print('TITLE', re.sub(r'\s+', ' ', title.group(1))[:150] if title else '(none)')
              endpoints = sorted(set(re.findall(r'''["']((?:/|https://data\.ijto\.or\.kr/)[^"'\s<>]{1,180}\.do)(?:\?[^"']*)?["']''', body)))
              print('PUBLIC_ENDPOINT_REFERENCES', json.dumps([x for x in endpoints if not re.search(r'login|logout|admin|password|secret|token|delete|update|insert', x, re.I)][:35], ensure_ascii=False))
              print('SCRIPT_LINKS', json.dumps([safe_url(urllib.parse.urljoin(url, x)) for x in parser.scripts][:35], ensure_ascii=False))
              print('FRAME_LINKS', json.dumps([safe_url(urllib.parse.urljoin(url, x)) for x in parser.frames][:5], ensure_ascii=False))
              return parser

          parser = inspect(PAGE)
          if not parser: raise SystemExit(0)
          linked = [urllib.parse.urljoin(PAGE, x) for x in parser.frames + parser.scripts]
          linked = [x for x in linked if urllib.parse.urlsplit(x).netloc == 'data.ijto.or.kr' and urllib.parse.urlsplit(x).scheme == 'https']
          linked.sort(key=lambda x: 0 if re.search(r'gis|sub01|live|map|realtime|population', x, re.I) else 1)
          count=0
          for url in dict.fromkeys(linked):
              if count >= 6: break
              if re.search(r'jquery|bootstrap|swiper|highcharts|echarts|font|polyfill', url, re.I): continue
              time.sleep(1)
              inspect(url); count+=1
          print('DONE: diagnostics only. No population values inferred, no dataset IDs guessed, no runtime feed enabled.')
          PY
