name: Check official 981 public data
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/check-public-jto.yml'
permissions: {}
concurrency:
  group: check-public-jto
  cancel-in-progress: false
jobs:
  inspect-public-route:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect public routes without credentials or TLS bypass
        shell: bash
        run: |
          python3 - <<'PY'
          import json, re, time, urllib.request, urllib.error, urllib.parse, urllib.robotparser
          from html.parser import HTMLParser
          from datetime import datetime, timezone
          UA = 'JejuNow981-PublicRouteCheck/1.0'
          LIMIT = 1500000
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl): return None
          opener = urllib.request.build_opener(NoRedirect)
          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept':'text/html,application/json,text/plain,*/*'})
              try:
                  with opener.open(req,timeout=15) as r:
                      raw=r.read(LIMIT+1)
                      if len(raw)>LIMIT: return r.status,'','response-too-large'
                      return r.status,raw.decode('utf-8','replace'),r.headers.get('Content-Type','')
              except urllib.error.HTTPError as e: return e.code,'','http-error-or-redirect'
              except urllib.error.URLError as e: return 0,'',type(e.reason).__name__+': '+str(e.reason)[:240]
              except Exception as e: return 0,'',type(e).__name__+': '+str(e)[:240]
          def safe_url(url):
              p=urllib.parse.urlsplit(url)
              return urllib.parse.urlunsplit((p.scheme,p.netloc,p.path,'',''))
          print('CHECKED_AT',datetime.now(timezone.utc).isoformat())
          for suffix in ['/health','/api/v1/parks/981/skt/status']:
              code,body,kind=get('https://jeju-now-981.onrender.com'+suffix)
              print('SERVICE',suffix,'HTTP',code,kind)
              if code==200:
                  try:
                      obj=json.loads(body)
                      print('SERVICE_FIELDS',json.dumps({k:obj.get(k) for k in ['ok','mode','source','connected','configured','state','provider','providerState'] if k in obj},ensure_ascii=False)[:3500])
                  except ValueError: print('SERVICE_NON_JSON')
          class Links(HTMLParser):
              def __init__(self): super().__init__(); self.scripts=[]; self.frames=[]
              def handle_starttag(self,tag,attrs):
                  attrs=dict(attrs)
                  if tag=='script' and attrs.get('src'): self.scripts.append(attrs['src'])
                  if tag=='iframe' and attrs.get('src'): self.frames.append(attrs['src'])
          pages=[
              'https://data.ijto.or.kr/bigdata/sub01.do?contentsid=CNTS_200000000008633',
              'https://www.visitjeju.net/kr/detail/view?contentsid=CNTS_200000000008633'
          ]
          for page in pages:
              p=urllib.parse.urlsplit(page); root=p.scheme+'://'+p.netloc
              code,text,kind=get(root+'/robots.txt')
              print('ROBOTS',root,code,kind)
              robot=urllib.robotparser.RobotFileParser()
              if code==200 and 'text/html' not in kind.lower(): robot.parse(text.splitlines())
              elif code==404: robot.parse([])
              else:
                  print('STOP: policy unavailable; no further requests to this host'); continue
              def inspect(url):
                  if not robot.can_fetch(UA,url): print('ROBOTS_DISALLOWED',safe_url(url)); return None
                  code,body,kind=get(url)
                  print('PUBLIC_PAGE',safe_url(url),'HTTP',code,kind,'CHARACTERS',len(body))
                  if code!=200: return None
                  if re.search(r'access denied|verify you are human|captcha challenge',body,re.I):
                      print('STOP: challenge page; no bypass attempted'); return None
                  parser=Links()
                  if 'html' in kind:
                      parser.feed(body)
                      title=re.search(r'<title[^>]*>(.*?)</title>',body,re.S|re.I)
                      print('TITLE',re.sub(r'\s+',' ',title.group(1))[:150] if title else '(none)')
                  refs=sorted(set(re.findall(r'''["']((?:/|https://)[^"'\s<>]{1,180}\.do)(?:\?[^"']*)?["']''',body)))
                  print('PUBLIC_ENDPOINT_REFERENCES',json.dumps([x for x in refs if not re.search(r'login|logout|admin|password|secret|token|delete|update|insert',x,re.I)][:35],ensure_ascii=False))
                  print('SCRIPT_LINKS',json.dumps([safe_url(urllib.parse.urljoin(url,x)) for x in parser.scripts][:35],ensure_ascii=False))
                  print('FRAME_LINKS',json.dumps([safe_url(urllib.parse.urljoin(url,x)) for x in parser.frames][:5],ensure_ascii=False))
                  return parser
              parser=inspect(page)
              if not parser: continue
              linked=[urllib.parse.urljoin(page,x) for x in parser.frames+parser.scripts]
              linked=[x for x in linked if urllib.parse.urlsplit(x).netloc==p.netloc and urllib.parse.urlsplit(x).scheme=='https']
              linked.sort(key=lambda x:0 if re.search(r'gis|sub01|live|map|realtime|population',x,re.I) else 1)
              count=0
              for url in dict.fromkeys(linked):
                  if count>=6: break
                  if re.search(r'jquery|bootstrap|swiper|highcharts|echarts|font|polyfill',url,re.I): continue
                  time.sleep(1); inspect(url); count+=1
          print('DONE: diagnostics only; no guessed dataset IDs or runtime feed activation.')
          PY
